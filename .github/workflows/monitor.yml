# Monitor de TeamSystem Identity con avisos por Telegram.
# Este fichero va en tu repositorio en la ruta: .github/workflows/monitor.yml

name: Monitor Identity

on:
  schedule:
    # Cada 5 minutos. GitHub no es puntual al minuto: puede retrasarse
    # unos minutos si hay cola. Para vigilancia critica al segundo hace
    # falta un servidor propio o un servicio de uptime de pago.
    - cron: "*/5 * * * *"
  # Permite lanzarlo a mano desde la pestana Actions con un boton
  workflow_dispatch:

# Necesario para que el workflow pueda guardar el fichero de estado
permissions:
  contents: write

# Evita que se solapen dos ejecuciones si una se queda atascada
concurrency:
  group: monitor-identity
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ejecutar el monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Descomenta la linea siguiente si ademas quieres avisos en Teams
          # TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python monitor_identity.py --exit-zero

      # Guarda la memoria del monitor como un fichero del repositorio.
      # Solo crea un commit cuando el estado cambia de verdad (una caida,
      # una recuperacion): si todo sigue igual, no toca nada.
      - name: Guardar el estado para la proxima vez
        if: always()
        run: |
          if [ -n "$(git status --porcelain .identity_monitor_state.json)" ]; then
            git config user.name "monitor-identity"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .identity_monitor_state.json
            git commit -m "Estado del monitor actualizado [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
            echo "Estado guardado."
          else
            echo "Sin cambios de estado, no hay nada que guardar."
          fi
